<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti 💖</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ff3366;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            color: #ff69b4;
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff69b4;
        }

        .corazon {
            color: #ff0055;
            font-size: 1.2rem;
            line-height: 1.2;
            white-space: pre;
            margin-bottom: 30px;
            text-shadow: 0 0 8px #ff0055;
        }

        .lista-te-amo {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .linea {
            font-size: 1.1rem;
            font-weight: bold;
            opacity: 0;
            transform: translateY(10px);
            animation: aparecer 0.3s forwards;
        }

        .rosa { color: #ff69b4; text-shadow: 0 0 5px #ff69b4; }
        .rojo { color: #ff0055; text-shadow: 0 0 5px #ff0055; }

        @keyframes aparecer {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .final {
            margin-top: 30px;
            font-size: 1.3rem;
            color: #e600e6;
            text-shadow: 0 0 10px #e600e6;
            display: none;
        }
    </style>
</head>
<body>

    <h1>💖 INICIANDO DEMOSTRACIÓN DE AFECTO 💖</h1>

    <div class="corazon" id="corazon"></div>
    <div class="lista-te-amo" id="contenedor"></div>
    <div class="final" id="mensaje-final">✨ ¡1000 veces 'Te amo' completadas con éxito! ✨</div>

    <script>
        // Dibujar corazón
        const corazonASCII = [
            "  ❤❤   ❤❤  ",
            " ❤❤❤❤ ❤❤❤❤ ",
            "❤❤❤❤❤❤❤❤❤❤❤",
            " ❤❤❤❤❤❤❤❤❤ ",
            "   ❤❤❤❤❤❤   ",
            "     ❤❤     "
        ];
        document.getElementById('corazon').innerText = corazonASCII.join('\n');

        // Generar las 1000 líneas
        const contenedor = document.getElementById('contenedor');
        const mensajeFinal = document.getElementById('mensaje-final');
        let contador = 1;

        function agregarLinea() {
            if (contador <= 1000) {
                const div = document.createElement('div');
                div.className = `linea ${contador % 2 === 0 ? 'rosa' : 'rojo'}`;
                div.innerText = "❤ Te amo ❤";
                contenedor.appendChild(div);
                
                // Hace scroll automático hacia abajo
                window.scrollTo(0, document.body.scrollHeight);
                
                contador++;
                setTimeout(agregarLinea, 10); // Velocidad de aparición
            } else {
                mensajeFinal.style.display = 'block';
                window.scrollTo(0, document.body.scrollHeight);
            }
        }

        setTimeout(agregarLinea, 1000);
    </script>
</body>
</html>
